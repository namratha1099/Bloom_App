<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom — daily journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5EFF9; --surface:#FFFFFF; --ink:#33243F; --soft:#7A6A88; --line:#E6DCEF;
  --accent:#8E5FB8; --moss:#5F8452; --grass:#7FA86A; --petal:#EE8FA8; --butter:#F2C85B;
  --sky1:#CFE6F7; --sky2:#F7E3EE; --soil:#A9876A; --soil2:#8C6C52; --onaccent:#FFFFFF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1422; --surface:#271E31; --ink:#F1E8F8; --soft:#B6A6C4; --line:#3B2F47;
  --accent:#C49BEA; --moss:#8DB57D; --grass:#5E8752; --petal:#F2A3B9; --butter:#F4D27A;
  --sky1:#1E2A47; --sky2:#3A2B4E; --soil:#5E4A3A; --soil2:#4A3A2D; --onaccent:#1A1422; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1422; --surface:#271E31; --ink:#F1E8F8; --soft:#B6A6C4; --line:#3B2F47;
  --accent:#C49BEA; --moss:#8DB57D; --grass:#5E8752; --petal:#F2A3B9; --butter:#F4D27A;
  --sky1:#1E2A47; --sky2:#3A2B4E; --soil:#5E4A3A; --soil2:#4A3A2D; --onaccent:#1A1422; color-scheme:dark}
:root[data-palette="forest"]{--accent:#4F8A5B;--petal:#E9A06B}
:root[data-palette="ocean"]{--accent:#3D7FB0;--petal:#7FC6D9}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:"Young Serif",Georgia,serif;font-weight:400;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 110px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:2.3rem;line-height:1}
.stats{display:flex;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 12px;text-align:center;min-width:72px}
.stat b{display:block;font-size:1.2rem;color:var(--accent);line-height:1.2}
.stat small{color:var(--soft);font-size:.75rem}

/* week strip */
.week{display:grid;grid-template-columns:auto repeat(7,1fr) auto;gap:6px;align-items:center;margin:16px 0 4px}
.week .arrow{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:34px;height:52px}
.week .arrow:disabled{opacity:.3;cursor:default}
.dchip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:4px 0;display:flex;flex-direction:column;align-items:center;font-size:.75rem;color:var(--soft);height:64px;justify-content:center}
.dchip .e{font-size:1.15rem;line-height:1.3}
.dchip .n{font-weight:800;color:var(--ink);font-size:.9rem}
.dchip[aria-current="date"]{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.dchip:disabled{opacity:.3;cursor:default}
.dchip .dots{height:6px;display:flex;gap:2px}
.dchip .dots i{width:5px;height:5px;border-radius:50%;background:var(--moss)}
.datelabel{font-family:"Young Serif",serif;font-size:1.25rem;margin:10px 0 2px}
.unlockbar{font-size:.88rem;color:var(--soft);margin-bottom:14px}

/* garden */
.garden{position:relative;height:260px;border-radius:26px 26px 10px 10px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(var(--sky1),var(--sky2) 74%);user-select:none}
.garden.w-cloudy,.garden.w-rainy{--sky1:#AEB9C7;--sky2:#D9DEE6}
.garden.w-snowy{--sky1:#D6E2EF;--sky2:#F3F6FA}
.w-cloudy .celestial,.w-rainy .celestial{opacity:.25}
.w-snowy .ground{background:linear-gradient(#F4F7FB 0 14px,var(--soil) 14px,var(--soil2))}
.w-snowy .ground::before{background:radial-gradient(circle at 6px 10px,#F4F7FB 6px,transparent 7px) 0 0/12px 10px repeat-x}
.cloud.dark{background:rgba(130,140,158,.85)}
.drop{position:absolute;top:-20px;width:2px;height:14px;border-radius:2px;background:rgba(110,140,195,.75);animation:rain .8s linear infinite;z-index:150;pointer-events:none}
@keyframes rain{to{transform:translate(-14px,300px)}}
.flake{position:absolute;top:-14px;color:#fff;font-size:12px;animation:snow 7s linear infinite;z-index:150;pointer-events:none;text-shadow:0 0 2px rgba(0,0,0,.2)}
@keyframes snow{50%{transform:translate(18px,150px)}to{transform:translate(-6px,300px)}}
.garden.night{--sky1:#1C2545;--sky2:#43355E}
.celestial{position:absolute;right:30px;top:20px;width:48px;height:48px;border-radius:50%;background:var(--butter);box-shadow:0 0 0 10px color-mix(in srgb,var(--butter) 25%,transparent)}
.garden.night .celestial{background:#F3EBD3;box-shadow:inset -12px -4px 0 0 #D9CFB2}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0}
.garden.night .star{opacity:.8}
.cloud{position:absolute;height:22px;width:70px;border-radius:20px;background:rgba(255,255,255,.75);animation:drift 60s linear infinite}
.cloud::before{content:"";position:absolute;width:34px;height:34px;border-radius:50%;background:inherit;left:14px;top:-14px}
.garden.night .cloud{opacity:.15}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(900px)}}
.ground{position:absolute;left:0;right:0;bottom:0;height:62px;background:linear-gradient(var(--grass) 0 12px,var(--soil) 12px,var(--soil2))}
.ground::before{content:"";position:absolute;left:0;right:0;top:-8px;height:10px;
  background:radial-gradient(circle at 6px 10px,var(--grass) 6px,transparent 7px) 0 0/12px 10px repeat-x}
.plant{position:absolute;bottom:44px;transform-origin:bottom center;border:0;background:none;padding:0}
.plant svg{display:block;transform-origin:bottom center;animation:sway 4s ease-in-out infinite}
.plant.new svg{animation:grow .9s cubic-bezier(.3,1.6,.5,1),sway 4s ease-in-out .9s infinite}
.plant:hover svg,.plant:focus-visible svg{filter:brightness(1.08)}
.plant.wiggle svg{animation:wiggle .6s ease}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes grow{from{transform:scale(.1,0)}to{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.bfly{position:absolute;font-size:18px;animation:flutter 9s ease-in-out infinite;pointer-events:none}
@keyframes flutter{0%{transform:translate(0,0)}25%{transform:translate(80px,-30px)}50%{transform:translate(160px,10px)}75%{transform:translate(70px,40px)}100%{transform:translate(0,0)}}
.gtip{position:absolute;background:var(--ink);color:var(--bg);font-size:.82rem;padding:5px 10px;border-radius:10px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-100%);z-index:5}
.gempty{position:absolute;left:0;right:0;top:38%;text-align:center;color:var(--soft)}
.gbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:.88rem;color:var(--soft);flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem}
.chipbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:800}
@media (prefers-reduced-motion:reduce){.plant svg,.plant.new svg,.cloud,.bfly,.drop,.flake{animation:none}}
.stroopword{font-family:"Young Serif",serif;font-size:2.6rem;margin:6px 0 12px}
.cbtns{display:flex;gap:8px;flex-wrap:wrap}
.cbtns button{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 14px;font-weight:800}
.rgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:380px}
.rgrid button{aspect-ratio:1;font-size:1.6rem;border:2px solid var(--line);background:var(--bg);border-radius:12px}
.rgrid button.hit{border-color:var(--moss);background:color-mix(in srgb,var(--moss) 25%,var(--bg))}
.rgrid button.miss{border-color:#D9534F;opacity:.5}
.seqrow{font-family:"Young Serif",serif;font-size:1.8rem;letter-spacing:.05em;margin-bottom:10px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:18px}
.panel h2{font-size:1.3rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-family:Nunito,sans-serif;font-size:.85rem;color:var(--soft)}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;background:var(--moss);transition:width .4s}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.btn{background:var(--accent);color:var(--onaccent);border:0;border-radius:12px;padding:10px 16px;font-weight:800}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
ul{list-style:none;padding:0;margin:10px 0 0}
li.task{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px dashed var(--line)}
li.task label{flex:1;display:flex;gap:12px;align-items:center;cursor:pointer}
li.task input{width:22px;height:22px;accent-color:var(--moss)}
li.task.done .t{text-decoration:line-through;color:var(--soft)}
li.task .seed{font-size:1.1rem}
li.task .del{background:none;border:0;color:var(--soft);font-size:1rem}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{font-size:1.7rem;background:var(--bg);border:2px solid transparent;border-radius:14px;width:52px;height:52px;transition:transform .15s}
.moods button[aria-pressed="true"]{border-color:var(--accent);transform:scale(1.1)}
textarea{width:100%;min-height:96px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two .panel{margin-top:18px}
@media (max-width:640px){.two{grid-template-columns:1fr;gap:0}}

/* games */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.scr{font-family:"Young Serif",serif;font-size:2rem;letter-spacing:.2em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:320px}
.card{aspect-ratio:1;border-radius:12px;border:0;background:var(--accent);font-size:1.6rem;transition:transform .2s}
.card.open{background:var(--bg);transform:rotateY(180deg) scaleX(-1)}
.msg{margin-top:10px;font-weight:600;color:var(--moss);min-height:1.5em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:150px}
.slide{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:min(300px,100%);aspect-ratio:1;background:var(--line);border-radius:14px;overflow:hidden;padding:3px}
.tile{border:0;padding:0;background-size:300% 300%;border-radius:6px;transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile.blank{background:var(--bg)!important;cursor:default}
.preview{width:90px;aspect-ratio:1;border-radius:10px;background-size:cover;border:1px solid var(--line)}
.solved{display:flex;align-items:center;gap:12px;color:var(--moss);font-weight:700}
.archive{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.archive button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 9px;font-size:.82rem}
.archive button.won{border-color:var(--moss);color:var(--moss)}
.archive button[aria-current="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}

.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.9rem}
.badge.off{opacity:.4}
.timer{font-family:"Young Serif",serif;font-size:2.4rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.confetti{position:fixed;top:-20px;font-size:20px;pointer-events:none;z-index:19;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
.monthtag{position:absolute;left:16px;top:12px;z-index:6;font-family:"Young Serif",serif;color:var(--ink);line-height:1.15;pointer-events:none}
.monthtag b{display:block;font-weight:400;font-size:1.6rem}
.monthtag small{font-family:Nunito,sans-serif;font-size:.8rem;color:var(--soft)}
.garden.night .monthtag{color:#F1E8F8}.garden.night .monthtag small{color:#C9BEDB}
.leaf{position:absolute;top:-20px;font-size:14px;animation:leaffall 8s linear infinite;z-index:4;pointer-events:none}
@keyframes leaffall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(24px,140px) rotate(200deg)}100%{transform:translate(-10px,290px) rotate(380deg)}}
@media (prefers-reduced-motion:reduce){.leaf{display:none}}
.odd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px}
.odd button{font-size:1.8rem;aspect-ratio:1;border:1px solid var(--line);background:var(--bg);border-radius:14px}
.giftwrap{position:fixed;inset:0;background:rgba(20,10,30,.55);display:grid;place-items:center;z-index:30;padding:20px}
.giftcard{background:var(--surface);border-radius:24px;padding:28px;text-align:center;max-width:340px;width:100%}
.giftbox{font-size:5rem;border:0;background:none;animation:shake 1.2s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}
.giftdots{display:flex;gap:6px;margin-bottom:12px}
.giftdots i{width:28px;height:8px;border-radius:99px;background:var(--line)}
.giftdots i.on{background:var(--accent)}
.stickers{display:flex;flex-wrap:wrap;gap:8px;font-size:2rem}
.backup textarea{min-height:70px;font-size:.8rem;font-family:ui-monospace,monospace;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bloom</h1>
    <div class="stats">
      <div class="stat"><b id="points">0</b><small>points</small></div>
      <div class="stat"><b id="streak">0</b><small>day streak</small></div>
      <div class="stat"><b id="bloomCount">0</b><small>blooms</small></div>
    </div>
  </header>

  <div class="week" id="week"></div>
  <div class="datelabel" id="dateLabel"></div>
  <div class="unlockbar" id="unlockbar"></div>

  <div class="garden" id="garden" aria-label="Your garden. Each completed task grows a plant."></div>
  <div class="gbar">
    <span id="gcaption">Tap a plant to see which task grew it.</span>
    <span class="row">
      <button class="chipbtn" id="weatherBtn">☀️ Sunny</button>
      <button class="chipbtn" id="waterBtn">💧 Water garden</button>
      <button class="chipbtn" id="nightBtn" aria-pressed="false">🌙 Night</button>
    </span>
  </div>

  <div class="panel">
    <h2>Tasks <small id="taskCount"></small></h2>
    <div class="progress"><i id="prog" style="width:0"></i></div>
    <div class="addrow">
      <input id="taskInput" placeholder="Add a task, even a tiny one" aria-label="New task">
      <button class="btn" id="addTask">Plant</button>
    </div>
    <ul id="taskList"></ul>
  </div>

  <div class="two">
    <div class="panel"><h2>Mood</h2><div class="moods" id="moods"></div></div>
    <div class="panel"><h2>Journal</h2><textarea id="note" placeholder="What happened today? What did you notice?"></textarea></div>
  </div>

  <div class="panel">
    <h2>Games <small id="gameDay"></small></h2>
    <div class="tabs" id="gameTabs"></div>
    <div id="game"></div>
    <div class="archive" id="archive" aria-label="Play games from earlier days"></div>
  </div>

  <div class="panel"><h2>Surprise gifts <small id="giftNext"></small></h2><div class="giftdots" id="giftDots"></div><div class="stickers" id="stickers"></div></div>
  <div id="unlocked"></div>
  <div class="panel backup"><h2>Save &amp; backup <small>saves automatically in this browser</small></h2>
    <div class="row"><button class="btn" id="dlBackup">Download backup</button><button class="btn ghost" id="showBackup">Show backup code</button><label class="btn ghost" style="cursor:pointer">Restore from file<input type="file" id="fileIn" accept=".json,application/json" hidden></label></div>
    <textarea id="backupText" hidden aria-label="Backup code"></textarea>
    <div class="row" id="restoreRow" hidden style="margin-top:8px"><button class="btn" id="restoreBtn">Restore from this code</button></div>
    <div class="msg" id="backupMsg"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const KEY="bloom-journal-v1";
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S={start:null,days:{},points:0,palette:"lilac"};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=iso(new Date());
if(!S.start){S.start=today;save()}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let cur=today, gameDay=today, gameKind=null;
const day=k=>{const d=(S.days[k] ||= {tasks:[],mood:null,note:"",game:false,flowers:[]});d.games ||= {};if(d.game&&!d.games.legacy)d.games.legacy=true;return d};
const dayNum=k=>Math.round((new Date(k+"T12:00")-new Date(S.start+"T12:00"))/864e5);
const addDays=(k,n)=>{const d=new Date(k+"T12:00");d.setDate(d.getDate()+n);return iso(d)};

const weeksIn=Math.floor(dayNum(today)/7)+1;
const UNLOCKS=[
  {week:2,id:"themes",name:"Garden colours",desc:"choose a palette and light or dark mode"},
  {week:3,id:"badges",name:"Badges",desc:"earn badges for milestones"},
  {week:4,id:"focus",name:"Focus timer",desc:"a 25-minute timer worth 15 points"},
  {week:5,id:"gratitude",name:"Reflection prompt",desc:"a new question every day"},
  {week:6,id:"streakbonus",name:"Streak bonus",desc:"double game points on 7+ day streaks"},
];
const has=id=>UNLOCKS.find(u=>u.id===id).week<=weeksIn;

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>(seed=(Math.imul(seed,1664525)+1013904223)>>>0)/4294967296}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1900)}
function addPoints(n,why){S.points+=n;save();renderHeader();toast(`+${n} · ${why}`);setTimeout(checkGift,1000)}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  for(let i=0;i<24;i++){const c=document.createElement("div");c.className="confetti";c.textContent=["🌸","🌼","✨","🍃","🌷"][i%5];
    c.style.left=Math.random()*100+"vw";c.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),2600)}}
function streak(){let n=0,k=today;while(true){const x=S.days[k];if(x&&(x.tasks.some(t=>t.done)||x.game||Object.keys(x.games||{}).length)){n++;k=addDays(k,-1)}else break}return n}

/* ---------- garden ---------- */
const PLANTS=["daisy","tulip","sunflower","bell","bush","lavender"];
const PCOL=["var(--petal)","var(--accent)","#F49E7A","#9AD0C2","#F6B6D0","#B9A3F0"];
function plantSVG(f){
  const h=f.h,c=f.c,W=44,H=h+40,cx=22;
  const stem=`<path d="M${cx} ${H} Q${cx+f.bend} ${H-h/2} ${cx} ${H-h}" stroke="var(--moss)" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const leaf=`<path d="M${cx} ${H-h*.35} q-14 -4 -16 -14 q12 0 16 14z" fill="var(--moss)"/><path d="M${cx} ${H-h*.55} q14 -4 16 -14 q-12 0 -16 14z" fill="var(--moss)"/>`;
  const top=H-h; let head="";
  if(f.type==="daisy")head=[0,45,90,135,180,225,270,315].map(a=>`<ellipse cx="${cx}" cy="${top-9}" rx="4.5" ry="9" fill="${c}" transform="rotate(${a} ${cx} ${top})"/>`).join("")+`<circle cx="${cx}" cy="${top}" r="5.5" fill="var(--butter)"/>`;

const GAMES={sequence:"🧩 Number pattern",stroop:"🎨 Colour focus",recall:"🧠 Memory recall",oddone:"🔍 Odd one out",picture:"🖼️ Picture slide",scramble:"🔤 Word scramble",memory:"🃏 Memory match",guess:"🔢 Number guess",math:"➗ Quick math"};

  if(kind==="guess"){
    const n=1+Math.floor(r()*50);let tries=0;
    box.innerHTML=`<p>Guess my number from 1 to 50</p><div class="row"><input id="g" type="number" aria-label="Your guess"><button class="btn" id="go">Guess</button></div><div class="msg" id="m"></div>`;
    const chk=()=>{const v=+box.querySelector("#g").value;tries++;if(v===n)winGame(kind);else box.querySelector("#m").textContent=`${v<n?"Higher ⬆️":"Lower ⬇️"} (guess ${tries})`};
    box.querySelector("#go").onclick=chk;box.querySelector("#g").onkeydown=e=>{if(e.key==="Enter")chk()};
  }
  if(kind==="memory"){
    const deck=[...EMO,...EMO].sort(()=>r()-.5);let open=[],matched=new Set(),lock=false;
    box.innerHTML=`<p>Match all the pairs</p><div class="grid" id="grid"></div>`;const grid=box.querySelector("#grid");
    deck.forEach((e,i)=>{const b=document.createElement("button");b.className="card";b.setAttribute("aria-label","Card "+(i+1));
      b.onclick=()=>{if(lock||open.includes(i)||matched.has(i))return;b.textContent=e;b.classList.add("open");open.push(i);
        if(open.length===2){lock=true;const[a,c]=open;setTimeout(()=>{
          if(deck[a]===deck[c]){matched.add(a);matched.add(c)}else[a,c].forEach(k=>{grid.children[k].textContent="";grid.children[k].classList.remove("open")});
          open=[];lock=false;if(matched.size===deck.length)winGame(kind)},600)}};grid.appendChild(b)});
  }
  if(kind==="sequence"){
    const gen=()=>{const t=Math.floor(r()*5),a=1+Math.floor(r()*9),dd=2+Math.floor(r()*7);let s=[];
      if(t===0)for(let i=0;i<5;i++)s.push(a+dd*i);
      if(t===1){const m=2+Math.floor(r()*2);for(let i=0;i<5;i++)s.push(a*m**i)}
      if(t===2)for(let i=0;i<5;i++)s.push((a+i)**2);
      if(t===3){s=[a,a+1];while(s.length<5)s.push(s.at(-1)+s.at(-2))}
      if(t===4){s=[a+10];for(let i=0;i<4;i++)s.push(s.at(-1)+(i%2?-2:dd))}
      return s};
    const qs=[gen(),gen(),gen()];let i=0;
    const show=()=>{box.innerHTML=`<p>What comes next? Pattern ${i+1} of 3</p><div class="seqrow">${qs[i].slice(0,4).join(", ")}, ?</div><div class="row"><input id="g" type="number" aria-label="Next number"><button class="btn" id="go">Check</button><button class="btn ghost" id="hint">Hint</button></div><div class="msg" id="m"></div>`;
      const inp=box.querySelector("#g"),q=qs[i];
      const chk=()=>{if(+inp.value===q[4]){i++;i===3?winGame(kind):show()}else box.querySelector("#m").textContent="Not that one. Look at how each step changes."};
      box.querySelector("#go").onclick=chk;inp.onkeydown=e=>{if(e.key==="Enter")chk()};
      box.querySelector("#hint").onclick=()=>box.querySelector("#m").textContent=`Gaps: ${q.slice(1,4).map((v,j)=>v-q[j]).join(", ")}`};
    show();
  }
  if(kind==="stroop"){
    const C=[["Red","#E04848"],["Blue","#3D7FD9"],["Green","#3FA45B"],["Purple","#9B5FD0"],["Orange","#E8892E"]];
    let round=0,score=0;
    const show=()=>{const w=Math.floor(Math.random()*5);let ink;do{ink=Math.floor(Math.random()*5)}while(ink===w);
      box.innerHTML=`<p>Tap the colour of the <b>ink</b>, not the word. ${round+1} of 10 · score ${score}</p><div class="stroopword" style="color:${C[ink][1]}">${C[w][0]}</div><div class="cbtns"></div><div class="msg" id="m"></div>`;
      const cb=box.querySelector(".cbtns");C.forEach(([n],ci)=>{const b=document.createElement("button");b.textContent=n;
        b.onclick=()=>{if(ci===ink)score++;round++;
          if(round<10)show();else if(score>=8)winGame(kind);else{box.innerHTML=`<p>You got ${score} of 10. You need 8 to win.</p><button class="btn" id="again">Try again</button>`;box.querySelector("#again").onclick=()=>{round=0;score=0;show()}}};cb.appendChild(b)})};
    show();
  }
  if(kind==="recall"){
    const POOL=["🍎","🚲","🎈","🐢","🌵","🎸","🍩","🦊","⚓","🔑","🧁","🐳","🌻","🎲","🪁","🍉","🦉","🚀"].sort(()=>r()-.5);
    const shown=POOL.slice(0,6),board=POOL.slice(0,12).sort(()=>r()-.5);
    box.innerHTML=`<p>Remember these 6 items. They hide in 5 seconds.</p><div class="rgrid">${shown.map(e=>`<button tabindex="-1">${e}</button>`).join("")}</div><div class="msg" id="m">5</div>`;
    let t=5;const iv=setInterval(()=>{t--;const m=box.querySelector("#m");if(m)m.textContent=t;if(t<=0){clearInterval(iv);ask()}},1000);
    const ask=()=>{let hits=0,miss=0;box.innerHTML=`<p>Tap the 6 items you saw. One mistake allowed.</p><div class="rgrid" id="rg"></div><div class="msg" id="m"></div>`;
      board.forEach(e=>{const b=document.createElement("button");b.textContent=e;b.onclick=()=>{if(b.disabled)return;b.disabled=true;
        if(shown.includes(e)){b.className="hit";hits++}else{b.className="miss";miss++}
        if(miss>1){box.querySelector("#m").innerHTML=`Two misses. <button class="btn ghost" id="again">Try again</button>`;box.querySelectorAll("#rg button").forEach(x=>x.disabled=true);box.querySelector("#again").onclick=()=>renderGame()}
        else if(hits===6)setTimeout(()=>winGame(kind),300)};box.querySelector("#rg").appendChild(b)})};
  }
  if(kind==="math"){
    const qs=Array.from({length:5},()=>{const a=2+Math.floor(r()*12),b=2+Math.floor(r()*12),op=r()<.5?"+":"×";return{q:`${a} ${op} ${b}`,a:op==="+"?a+b:a*b}});let i=0;
    const show=()=>{box.innerHTML=`<p>Quick math, ${i+1} of 5</p><div class="scr">${qs[i].q}</div><div class="row" style="margin-top:10px"><input id="g" type="number" aria-label="Answer"><button class="btn" id="go">Next</button></div><div class="msg" id="m"></div>`;
      const inp=box.querySelector("#g");const chk=()=>{if(+inp.value===qs[i].a){i++;i===5?winGame(kind):show()}else box.querySelector("#m").textContent="Try again"};
      box.querySelector("#go").onclick=chk;inp.onkeydown=e=>{if(e.key==="Enter")chk()}};
    show();
  }
}

/* ---------- unlocked features ---------- */
const PROMPTS=["Who made you smile today?","What’s one small thing that went right?","What are you looking forward to?","What did you learn today?","Which moment would you replay?","What are you proud of this week?","What made today easier?"];
let timerIv=null,timerLeft=1500;
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function renderUnlocked(){
  const box=document.getElementById("unlocked");let h="";
  if(has("gratitude"))h+=`<div class="panel"><h2>Reflection</h2><p style="color:var(--soft);margin:0">${PROMPTS[hash(cur)%PROMPTS.length]}</p></div>`;
  if(has("focus"))h+=`<div class="panel"><h2>Focus timer</h2><div class="row"><span class="timer" id="tm">${fmt(timerLeft)}</span><button class="btn" id="tbtn">${timerIv?"Pause":"Start"}</button></div></div>`;
  if(has("badges")){const all=Object.values(S.days),tasks=all.reduce((a,d)=>a+d.tasks.filter(t=>t.done).length,0),games=all.reduce((a,d)=>a+Object.keys(d.games||{}).filter(x=>x!=="legacy").length+(d.games?.legacy?1:0),0);
    const B=[["🌱","First bloom",tasks>=1],["💐","25 tasks",tasks>=25],["🌳","100 tasks",tasks>=100],["🎮","10 games won",games>=10],["🖼️","Picture master",all.filter(d=>d.games?.picture).length>=5],["🔥","7-day streak",streak()>=7],["💎","1,000 points",S.points>=1000]];
    h+=`<div class="panel"><h2>Badges</h2><div class="badges">${B.map(b=>`<span class="badge ${b[2]?"":"off"}">${b[0]} ${b[1]}</span>`).join("")}</div></div>`}
  if(has("themes"))h+=`<div class="panel"><h2>Garden colours</h2><div class="row">${["lilac","forest","ocean"].map(p=>`<button class="chipbtn" data-p="${p}" aria-pressed="${S.palette===p}">${p}</button>`).join("")}<button class="chipbtn" data-mode>Switch light / dark</button></div></div>`;
  box.innerHTML=h;
  box.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.palette=b.dataset.p;save();applyTheme();renderUnlocked()});
  const m=box.querySelector("[data-mode]");if(m)m.onclick=()=>{const dark=getComputedStyle(document.documentElement).colorScheme.includes("dark");S.mode=dark?"light":"dark";save();applyTheme()};
  const tb=box.querySelector("#tbtn");if(tb)tb.onclick=()=>{
    if(timerIv){clearInterval(timerIv);timerIv=null;tb.textContent="Start";return}
    tb.textContent="Pause";timerIv=setInterval(()=>{timerLeft--;const tm=document.getElementById("tm");if(tm)tm.textContent=fmt(timerLeft);
      if(timerLeft<=0){clearInterval(timerIv);timerIv=null;timerLeft=1500;addPoints(15,"focus session 🧘");renderUnlocked()}},1000)};
}
function applyTheme(){const r=document.documentElement;
  if(has("themes")&&S.palette!=="lilac")r.dataset.palette=S.palette;else delete r.dataset.palette;
  if(has("themes")&&S.mode)r.dataset.theme=S.mode}

/* ---------- 4-day streak gifts ---------- */
const GIFTS=["🦄","🐉","🌈","🪐","🦚","🍀","🎐","🪷","🦊","🐳","🌟","🧸","🎈","🦩","🐢","🐙"];
function checkGift(){const s=streak(),earned=Math.floor(s/4),runStart=addDays(today,-(s-1));
  if(!S.giftRun||S.giftRun.start!==runStart)S.giftRun={start:runStart,claimed:0};
  if(earned>S.giftRun.claimed&&!document.querySelector(".giftwrap")){S.giftRun.claimed=earned;save();showGift(s)}
  renderStickers()}
function showGift(s){const w=document.createElement("div");w.className="giftwrap";
  w.innerHTML=`<div class="giftcard" role="dialog" aria-label="Surprise gift"><h2>${s}-day streak!</h2><p style="color:var(--soft)">You’ve shown up ${s} days in a row. Tap the box to open your surprise.</p><button class="giftbox" id="gb" aria-label="Open gift">🎁</button><div id="gr"></div></div>`;
  document.body.appendChild(w);
  w.querySelector("#gb").onclick=()=>{const sticker=GIFTS[Math.floor(Math.random()*GIFTS.length)],pts=50+Math.floor(Math.random()*6)*10;
    (S.stickers ||= []).push(sticker);
    day(today).flowers.push({x:5+Math.random()*82,c:"#fff",h:95,bend:0,type:"rainbow",task:"Streak gift 🎁"});
    S.points+=pts;save();confetti();w.querySelector("#gb").remove();
    w.querySelector("#gr").innerHTML=`<div style="font-size:4rem">${sticker}</div><p><b>+${pts} points</b>, a new sticker and a rare rainbow flower in today’s garden.</p><button class="btn" id="gclose">Collect</button>`;
    w.querySelector("#gclose").onclick=()=>{w.remove();renderAll()}}}
function renderStickers(){const s=streak(),prog=s%4,left=4-prog;
  document.getElementById("giftNext").textContent=`next gift in ${left} streak day${left===1?"":"s"}`;
  document.getElementById("giftDots").innerHTML=[0,1,2,3].map(i=>`<i class="${i<prog?"on":""}"></i>`).join("");
  const st=S.stickers||[];document.getElementById("stickers").innerHTML=st.length?st.map(x=>`<span>${x}</span>`).join(""):`<span style="font-size:.95rem;color:var(--soft)">Keep a 4-day streak to unwrap your first surprise.</span>`}

/* ---------- backup ---------- */
const msgB=t=>document.getElementById("backupMsg").textContent=t;
function importData(txt){try{const o=JSON.parse(txt);if(!o||!o.days)throw 0;S=o;save();applyTheme();renderAll();msgB("Backup restored ✓")}catch(e){msgB("That backup couldn’t be read. Make sure you copied all of it.")}}
document.getElementById("dlBackup").onclick=()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download=`bloom-backup-${today}.json`;document.body.appendChild(a);a.click();a.remove();msgB("Backup downloaded. If nothing appeared, use “Show backup code”.")}catch(e){msgB("Downloads are blocked here. Use “Show backup code” instead.")}};
document.getElementById("showBackup").onclick=()=>{const t=document.getElementById("backupText");t.hidden=!t.hidden;t.value=JSON.stringify(S);document.getElementById("restoreRow").hidden=t.hidden;if(!t.hidden)t.select()};
document.getElementById("restoreBtn").onclick=()=>importData(document.getElementById("backupText").value);
document.getElementById("fileIn").onchange=e=>{const f=e.target.files[0];if(f)f.text().then(importData)};

/* ---------- header ---------- */
function renderHeader(){
  document.getElementById("points").textContent=S.points;
  document.getElementById("streak").textContent=streak();
  document.getElementById("bloomCount").textContent=Object.values(S.days).reduce((a,d)=>a+(d.flowers?.length||0),0);
  const d=new Date(cur+"T12:00");
  document.getElementById("dateLabel").textContent=(cur===today?"Today, ":"")+d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  const nx=UNLOCKS.find(u=>u.week>weeksIn),left=nx?(nx.week-1)*7-dayNum(today):0;
  document.getElementById("unlockbar").textContent=nx?`Week ${weeksIn}. In ${left} day${left===1?"":"s"} you unlock ${nx.name}: ${nx.desc}.`:`Week ${weeksIn}. Every feature is unlocked.`;
}
function renderAll(){renderHeader();renderWeek();renderGarden(false);renderTasks();renderMood();note.value=day(cur).note;renderGameArea();renderUnlocked();renderStickers()}
applyTheme();renderAll();setTimeout(checkGift,600);
</script>
